# Activated with: --spring.profiles.active=ai
# Switches the summary generator from the deterministic template to Azure OpenAI.
# Secrets are read from environment variables so nothing sensitive is committed.
ea:
  ai:
    azure:
      endpoint: ${AZURE_OPENAI_ENDPOINT:}
      api-key: ${AZURE_OPENAI_API_KEY:}
      deployment: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o-mini}
      api-version: ${AZURE_OPENAI_API_VERSION:2024-06-01}
      timeout: ${AZURE_OPENAI_TIMEOUT:20s}
      max-tokens: ${AZURE_OPENAI_MAX_TOKENS:500}
      temperature: ${AZURE_OPENAI_TEMPERATURE:0.2}

